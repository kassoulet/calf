---
name: build
'on': [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-dpf:
    name: linux-dpf
    runs-on: ubuntu-latest
    steps:
      - name: Update
        run: sudo apt-get --yes update
      - name: Install dependencies
        run: sudo apt-get --yes install
          build-essential pkg-config python3
          fluidsynth libfluidsynth-dev libexpat1-dev
          libjack-jackd2-dev
          libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxinerama-dev
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Build (all plugins)
        run: make -C calf-dpf -j$(nproc)
      - name: Smoke test (standalones)
        run: make -C calf-dpf smoke
      - name: DSP smoke test
        run: make -C calf-dpf dsp-smoke
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-plugins
          path: calf-dpf/bin/
